{% extends 'base.html' %}

{% block title %}Security Error{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card card-hover border-danger">
                <div class="card-header bg-danger text-white text-center">
                    <h4><i class="fas fa-exclamation-triangle me-2"></i>Security Error</h4>
                </div>
                <div class="card-body text-center">
                    <i class="fas fa-shield-alt fa-4x text-danger mb-3"></i>
                    <h5>CSRF Token Not Verified</h5>
                    <p class="text-muted">Please <a href="{% url 'AppTodo:login' %}">try again</a> or clear your browser cache.</p>
                    <a href="{% url 'AppTodo:login' %}" class="btn btn-primary">
                        <i class="fas fa-arrow-left me-2"></i>Back to Login
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
