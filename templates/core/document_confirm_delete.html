{% extends 'base.html' %}

{% block title %}Delete Document - DocShare{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card card-hover">
                <div class="card-header bg-danger text-white">
                    <h4><i class="fas fa-exclamation-triangle me-2"></i>Confirm Deletion</h4>
                </div>
                <div class="card-body text-center">
                    <i class="fas fa-file-alt fa-4x text-danger mb-3"></i>
                    <h5>Are you sure you want to delete this document?</h5>
                    <p class="text-muted">
                        <strong>{{ document.title }}</strong><br>
                        <small>This action cannot be undone!</small>
                    </p>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="d-flex gap-2 justify-content-center">
                            <button type="submit" class="btn btn-danger">
                                <i class="fas fa-trash me-2"></i>Yes, Delete
                            </button>
                            <a href="{% url 'AppTodo:document_detail' document.pk %}" class="btn btn-secondary">
                                <i class="fas fa-times me-2"></i>Cancel
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
